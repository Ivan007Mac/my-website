<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ivan Chan Professional Webpage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        /* Navigation Bar */
        nav {
            background-color: #1f2d3d;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        nav a:hover {
            opacity: 0.7;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(to right, #4e73df, #1cc88a);
            color: white;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
        }

        .hero button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            background-color: white;
            color: #4e73df;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .hero button:hover {
            background-color: #e2e6ea;
        }

        /* Content Section */
        .content {
            padding: 50px 20px;
            text-align: center;
        }

        .content img {
            width: 300px;
            border-radius: 10px;
            margin-top: 20px;
        }

        /* Footer */
        footer {
            background-color: #1f2d3d;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>My Website</h2>
        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to Dr. Ivan Chan Website</h1>
        <p>A simple professional webpage built with HTML & CSS</p>
        <button>Learn More</button>
    </section>

    <!-- Content Section -->
    <section class="content">
        <h2>About Me</h2>
        <p>This is a clean, modern layout suitable for personal profile, clinic page, or small business website.</p>
        <img src="photo.jpg" alt="My Photo">
    </section>

    <!-- Footer -->
    <footer>
        © 2026 My Website | All Rights Reserved
    </footer>

</body>
</html>
